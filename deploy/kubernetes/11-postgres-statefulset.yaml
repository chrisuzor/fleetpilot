# One Postgres pod. The user and password match Compose: both are fleetpilot.
# That is a local default, not a deployed credential.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fleetpilot
  labels:
    app.kubernetes.io/name: fleetpilot
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetpilot
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetpilot
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: fleetpilot
            - name: POSTGRES_PASSWORD
              value: fleetpilot
            - name: POSTGRES_DB
              value: fleetpilot
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fleetpilot", "-d", "fleetpilot"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fleetpilot", "-d", "fleetpilot"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
