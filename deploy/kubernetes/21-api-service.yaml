# ClusterIP only. Reach the API with kubectl port-forward, which binds localhost.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fleetpilot
  labels:
    app.kubernetes.io/name: fleetpilot
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: fleetpilot
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
