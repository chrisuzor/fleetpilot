name: fleetpilot

services:
  postgres:
    image: postgres:16-alpine
    # Host port 5432 is not published. The API reaches Postgres on the Compose network.
    environment:
      POSTGRES_USER: fleetpilot
      POSTGRES_PASSWORD: fleetpilot
      POSTGRES_DB: fleetpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpilot -d fleetpilot"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://fleetpilot:fleetpilot@postgres:5432/fleetpilot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
